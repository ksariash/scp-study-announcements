<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172554">
  <title>SCP Study Announcements</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section id="loginView" class="auth-card">
      <div class="brand-lockup">
        <div class="brand-mark">S</div>
        <div><h1>SCP Announcements</h1><p>Passwordless sign in</p></div>
      </div>
      <form id="emailForm" class="stack">
        <label>Email<input id="loginEmail" type="email" autocomplete="email" required></label>
        <button class="primary" type="submit">Send code</button>
      </form>
      <form id="codeForm" class="stack hidden">
        <label>Verification code<input id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></label>
        <button class="primary" type="submit">Sign in</button>
        <button class="quiet" id="backToEmail" type="button">Use a different email</button>
      </form>
      <p id="loginStatus" class="status"></p>
    </section>

    <section id="appView" class="hidden">
      <header class="app-header">
        <div><span class="eyebrow">SCP Study</span><h1>Announcements</h1></div>
        <div class="app-header-actions">
          <nav class="app-links" aria-label="SCP apps">
            <a href="https://scp-study.ksariash.workers.dev/" target="_blank" rel="noopener">Study</a>
            <a href="https://scp-study-analytics.ksariash.workers.dev/" target="_blank" rel="noopener">Dashboard</a>
          </nav>
          <div class="account"><span id="accountLabel"></span><button id="logoutBtn" class="icon-action" title="Sign out" aria-label="Sign out">↪</button></div>
        </div>
      </header>

      <nav class="tabs" aria-label="Sections">
        <button class="tab active" data-tab="compose">Compose</button>
        <button class="tab" data-tab="sent">Sent</button>
        <button class="tab hidden" id="adminTabBtn" data-tab="admin">Admin</button>
      </nav>

      <section class="panel" data-panel="compose">
        <div class="compose-grid">
          <label>Audience<select id="audienceSelect"></select></label>
          <label>Type<select id="messageType"><option value="announcement">Announcement</option><option value="poll">Poll</option><option value="feedback_request">Feedback request</option></select></label>
        </div>
        <div id="audienceSummary" class="audience-summary"></div>
        <div id="broadcastNotice" class="gentle-warning hidden"></div>

        <label class="title-field">Title<input id="messageTitle" maxlength="120"></label>

        <div class="editor-wrap">
          <div class="editor-toolbar" aria-label="Formatting">
            <button type="button" data-command="bold" title="Bold" aria-label="Bold"><strong>B</strong></button>
            <button type="button" data-command="italic" title="Italic" aria-label="Italic"><em>I</em></button>
            <button type="button" data-command="underline" title="Underline" aria-label="Underline"><u>U</u></button>
            <button type="button" data-command="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">• List</button>
            <button type="button" data-command="insertOrderedList" title="Numbered list" aria-label="Numbered list">1. List</button>
            <button type="button" id="linkBtn" title="Add link" aria-label="Add link">Link</button>
          </div>
          <div id="richEditor" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Write your message…"></div>
        </div>

        <label class="message-media-field">
          <span>Media attachments <small>optional</small></span>
          <input id="messageMedia" type="file" accept="image/*,audio/*,video/*" multiple>
          <small>Attach up to 3 images, audio files, or videos, 10 MB each.</small>
        </label>

        <section id="pollFields" class="poll-fields hidden">
          <div class="section-head"><h2>Poll options</h2><button id="addPollOption" class="quiet compact" type="button">+ Option</button></div>
          <div id="pollOptions" class="poll-options"></div>
        </section>

        <div class="send-row">
          <span id="composeStatus" class="status"></span>
          <button id="sendBtn" class="primary" type="button">Send</button>
        </div>
      </section>

      <section class="panel hidden" data-panel="sent">
        <div class="section-head"><h2>Sent</h2><button id="refreshSent" class="icon-action" type="button" title="Refresh" aria-label="Refresh">↻</button></div>
        <div id="sentList" class="sent-list"></div>
      </section>

      <section class="panel hidden" data-panel="admin">
        <div class="section-head"><h2>Accounts</h2><button id="newUserBtn" class="quiet compact" type="button">New account</button></div>
        <div id="usersList" class="users-list"></div>

        <form id="userForm" class="admin-form hidden">
          <div class="compose-grid">
            <label>Email<input id="userEmail" type="email" required></label>
            <label>Name<input id="userName" maxlength="120"></label>
          </div>
          <div class="permission-grid">
            <label><input id="permAnnouncements" type="checkbox"> Chabura announcements</label>
            <label><input id="permPolls" type="checkbox"> Chabura polls</label>
            <label><input id="permBroadcasts" type="checkbox"> Broadcasts</label>
            <label><input id="permAdmin" type="checkbox"> Administrator</label>
            <label><input id="userActive" type="checkbox" checked> Active</label>
            <label><input id="sendInvite" type="checkbox"> Send invite email</label>
          </div>
          <div class="directory-tools">
            <label>Chaburas<input id="chaburaSearch" type="search" placeholder="Search rabbi or region"></label>
          </div>
          <div id="chaburaPicker" class="chabura-picker"></div>
          <div class="form-actions">
            <button id="cancelUserEdit" class="quiet" type="button">Cancel</button>
            <button class="primary" type="submit">Save account</button>
          </div>
          <p id="userStatus" class="status"></p>
        </form>
      </section>
    </section>
  </main>

  <dialog id="confirmBroadcast">
    <div class="dialog-card">
      <h2>Send to all SCP students?</h2>
      <p id="confirmBroadcastText"></p>
      <div class="dialog-actions"><button id="cancelBroadcast" class="quiet" type="button">Cancel</button><button id="confirmBroadcastSend" class="primary" type="button">Send broadcast</button></div>
    </div>
  </dialog>

  <dialog id="resultsDialog">
    <div class="dialog-card">
      <div class="section-head"><h2>Poll results</h2><button id="closeResults" class="icon-action" type="button" aria-label="Close">×</button></div>
      <div id="resultsBody"></div>
    </div>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
